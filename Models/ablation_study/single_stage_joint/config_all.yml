# Single-stage joint refinement: enables all CSR Stage II components
# directly from the reproduced COMPDEFECT checkpoint, without staged
# checkpoint transfer.
#
# IMPORTANT: before running, pass --load_model_path to your reproduced
# COMPDEFECT best-f1 checkpoint, e.g.:
#   --load_model_path ../../CSR/CompDefect/saved_models/checkpoint-best-f1/pytorch_model.bin
train_filename: '../../Data/train_data.csv'
dev_filename: '../../Data/val_data.csv'
type2label: '../../Data/type2label_all.json'
epochs: 50
pretrained_model: 'microsoft/graphcodebert-base'
do_train: true
do_eval: true
model_type: 'roberta'
model_name_or_path: 'microsoft/graphcodebert-base'
tokenizer_name: 'microsoft/graphcodebert-base'
config_name: 'microsoft/graphcodebert-base'
max_source_length: 448
max_target_length: 448
data_flow_length: 64
beam_size: 10
gradient_accumulation_steps: 4
train_batch_size: 32
eval_batch_size: 32
learning_rate: 1.0e-4
# Stage I (10) + Stage II (5) + Stage III (3) = 18 total epochs
num_train_epochs: 18
use_awl: false
num_labels: 17
cls_dropout_prob: 0.1
no_cuda: true
warmup_steps_ratio: 0.2
